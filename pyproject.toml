[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vmar-dynamics"
version = "0.1.16a1"
description = "Python interface to the vMAR C23 differential core"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Rubén Alexander More Valencia"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: C",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]

[project.urls]
Repository = "https://github.com/RubenMoreValencia/vMAR"
Documentation = "https://github.com/RubenMoreValencia/vMAR/blob/main/docs/G0.9-P2_PYTHON_API.md"

[tool.setuptools]
packages = ["vmar"]
